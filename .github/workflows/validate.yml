name: VoltPRo Quality Check
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check script.js
          node --check simulator.js
          node --check engineering.js
      - name: Validate required frontend files
        run: |
          test -s index.html
          test -s styles.css
          test -s script.js
          test -s simulator.html
          test -s simulator.css
          test -s simulator.js
          test -s engineering.html
          test -s engineering.css
          test -s engineering.js
          grep -q 'simulator.js' simulator.html
          grep -q 'simulator.css' simulator.html
      - name: Validate component registry
        run: node -e "const x=JSON.parse(require('fs').readFileSync('components.json','utf8')); if(x.format!=='voltpro-components'||!Array.isArray(x.library)||x.library.length<100) process.exit(1); console.log('registry entries:',x.library.length)"
