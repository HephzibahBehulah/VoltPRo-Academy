<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="VoltPRo Academy — interaktive Elektro-Ausbildung für Deutschland.">
<title>VoltPRo Academy | Electrical Training Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">V</div><div><span class="eyebrow">ACADEMY</span><h1>VoltPRo</h1></div></div>
    <div class="student-mini"><div class="avatar">ST</div><div><strong id="studentName">Student</strong><small>Electrical Apprentice</small></div></div>
    <nav class="nav" aria-label="Main navigation">
      <button class="nav-item active" data-view="dashboard"><span>⌂</span>Dashboard</button>
      <button class="nav-item" data-view="learn"><span>▣</span>Learn</button>
      <button class="nav-item" data-view="safety"><span>⚠</span>Safety</button>
      <button class="nav-item" data-view="labs"><span>⌘</span>Virtual Labs</button>
      <button class="nav-item" data-view="quiz"><span>✓</span>Assessments</button>
      <button class="nav-item" data-view="reference"><span>☷</span>Reference</button>
    </nav>
    <div class="sidebar-bottom">
      <div class="progress-mini"><div><span>Academy progress</span><strong id="sideProgress">0%</strong></div><div class="track"><i id="sideProgressBar"></i></div></div>
      <button class="nav-item" data-view="settings"><span>⚙</span>Settings</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button>
      <div class="crumb"><span>VoltPRo Academy</span><b>/</b><strong id="pageTitle">Dashboard</strong></div>
      <div class="top-actions">
        <label class="search"><span>⌕</span><input id="globalSearch" placeholder="Search lessons, tools, terms..." autocomplete="off"></label>
        <button class="icon-btn" id="languageBtn" title="Language">DE</button>
        <button class="icon-btn" id="resetBtn" title="Reset progress">↺</button>
      </div>
    </header>
    <div id="toast" class="toast" role="status"></div>
    <div id="view" class="view"></div>
  </main>
</div>
<dialog id="lessonDialog"><div id="lessonModal"></div></dialog>
<script src="script.js"></script>
</body>
</html>
